<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Die Seite ist öffentlich per URL erreichbar und enthält Zugangsdaten der
     Unterkunft: keine Beschreibung, keine OG-Tags, keine Indexierung. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Reisejournal 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,340&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ MASTHEAD ═══════════════════════════════════════════════════════════ -->
<header class="masthead">
  <div class="masthead-inner">
    <div class="mh-eyebrow rise rise-1" id="mh-eyebrow"></div>
    <div class="mh-right rise rise-1">
      <span class="mh-issue" id="mh-issue"></span>
      <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">Nachtausgabe</button>
    </div>
  </div>
</header>

<!-- ══ RUBRIKEN ═══════════════════════════════════════════════════════════ -->
<nav class="rubriken">
  <div class="rubriken-inner">
    <button class="rub active" onclick="switchTab('journal',this)">Journal</button>
    <button class="rub" onclick="switchTab('etappen',this)">Etappen</button>
    <button class="rub" onclick="switchTab('karte',this)">Karte</button>
  </div>
</nav>

<main class="wrap">

  <!-- ── JOURNAL ──────────────────────────────────────────────────────── -->
  <section class="section active" id="s-journal">
    <div class="opener">
      <h1 class="title rise rise-2" id="title"></h1>
      <div class="standfirst rise rise-3" id="standfirst"></div>
      <div class="dateline rise rise-3" id="dateline"></div>
    </div>

    <div class="stats rise rise-4" id="stats"></div>

    <div class="routeband">
      <div class="section-tag">Strecke</div>
      <div class="route" id="route"></div>
    </div>

    <div id="stand-wrap"></div>
    <div id="wetter-wrap"></div>

    <div class="toc">
      <div class="section-tag">Termine</div>
      <div id="toc-list"></div>
    </div>
  </section>

  <!-- ── ETAPPEN ──────────────────────────────────────────────────────── -->
  <section class="section" id="s-etappen">
    <div id="spreads"></div>
  </section>

  <!-- ── KARTE ────────────────────────────────────────────────────────── -->
  <section class="section" id="s-karte">
    <div class="figure">
      <div class="section-tag">Abbildung</div>
      <div class="figure-frame" id="figure-frame"></div>
      <div class="figcaption">Abb. 1 — Streckenverlauf Lenggries → Valdidentro</div>
    </div>
    <div class="verzeichnis">
      <div class="section-tag">Verzeichnis</div>
      <div id="vz-list"></div>
    </div>
  </section>

  <footer class="colophon">
    <span id="colophon-left"></span>
    <span id="colophon-right"></span>
  </footer>

</main>

<script src="data.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════
//  REISEJOURNAL — Alpine Editorial
// ═══════════════════════════════════════════════════════════════════════

// ── Helfer ─────────────────────────────────────────────────────────────
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function daysBetween(a,b) { return Math.round((b-a)/86400000); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function currentEtappe() {
  const d = today();
  return ETAPPEN.find(e => {
    const s = new Date(e.start); s.setHours(0,0,0,0);
    const en = new Date(e.end);  en.setHours(0,0,0,0);
    return d >= s && d < en;
  });
}
function nextEtappe() {
  const d = today();
  return ETAPPEN.find(e => { const s = new Date(e.start); s.setHours(0,0,0,0); return s > d; });
}

// ── Alpenpanorama, gezeichnet ──────────────────────────────────────────
// Kein Foto-Platzhalter, sondern eine eigene Illustration je Etappe.
// Sobald `foto` in data.js gesetzt ist, tritt sie dahinter zurück.
const PANORAMA = {
  pine: {
    sky: ['var(--sky1a)','var(--sky1b)'],
    far: { fill:'var(--r1a)', op: 0.34,
      d:'M0,268 L80,232 L150,258 L230,196 L300,240 L380,182 L460,232 L540,190 L620,238 L700,204 L780,244 L800,236 L800,600 L0,600 Z' },
    ridges: [
      { fill:'var(--r1a)', d:'M0,300 L60,276 L124,296 L190,228 L242,266 L302,214 L362,252 L432,202 L500,246 L562,222 L642,262 L722,234 L800,274 L800,600 L0,600 Z' },
      { fill:'var(--r1b)', d:'M0,368 L82,334 L152,362 L222,304 L302,346 L372,292 L452,334 L522,308 L602,350 L692,320 L762,356 L800,340 L800,600 L0,600 Z' },
      { fill:'var(--r1c)', d:'M0,458 L92,426 L172,454 L252,404 L342,440 L422,398 L522,438 L602,416 L702,450 L800,428 L800,600 L0,600 Z' },
      { fill:'var(--r1d)', d:'M0,548 L120,520 L242,546 L362,512 L482,542 L622,514 L742,544 L800,530 L800,600 L0,600 Z' },
    ],
    sun: { cx: 618, cy: 158, r: 46, fill: '#FBF4E2', op: 0.5 },
    snow: [],
  },
  amber: {
    sky: ['var(--sky2a)','var(--sky2b)'],
    far: { fill:'var(--r2a)', op: 0.30,
      d:'M0,250 L70,196 L130,238 L190,132 L258,196 L330,104 L404,180 L472,124 L546,192 L624,142 L706,208 L774,168 L800,200 L800,600 L0,600 Z' },
    ridges: [
      { fill:'var(--r2a)', d:'M0,300 L70,244 L122,284 L182,176 L250,242 L322,146 L400,224 L470,166 L542,238 L620,188 L702,254 L772,212 L800,248 L800,600 L0,600 Z' },
      { fill:'var(--r2b)', d:'M0,378 L74,330 L146,372 L214,296 L292,352 L364,286 L446,346 L520,300 L598,360 L682,314 L764,368 L800,344 L800,600 L0,600 Z' },
      { fill:'var(--r2c)', d:'M0,458 L96,412 L178,452 L262,394 L346,442 L430,398 L522,446 L610,410 L706,452 L800,424 L800,600 L0,600 Z' },
      { fill:'var(--r2d)', d:'M0,548 L118,516 L238,546 L358,512 L486,544 L618,514 L740,546 L800,530 L800,600 L0,600 Z' },
    ],
    sun: { cx: 178, cy: 132, r: 54, fill: '#FFF1D0', op: 0.62 },
    // Firnfelder auf den höchsten Gipfeln der Ortlergruppe
    snow: [
      'M322,146 L292,192 L354,194 Z',
      'M182,176 L154,220 L212,222 Z',
      'M470,166 L444,206 L498,208 Z',
    ],
  },
};

function panoramaSvg(variant, uid) {
  const p = PANORAMA[variant] || PANORAMA.pine;
  const gid = `sky-${uid}`, sid = `sun-${uid}`;
  // xMidYMax: das Gebirge bleibt in jedem Zuschnitt stehen, gekappt wird der Himmel.
  return `
  <svg class="illu" viewBox="0 0 800 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="${p.sky[0]}"/>
        <stop offset="72%"  stop-color="${p.sky[1]}"/>
        <stop offset="100%" stop-color="${p.sky[1]}"/>
      </linearGradient>
      <radialGradient id="${sid}">
        <stop offset="0%"   stop-color="${p.sun.fill}" stop-opacity="${p.sun.op}"/>
        <stop offset="42%"  stop-color="${p.sun.fill}" stop-opacity="${p.sun.op * 0.55}"/>
        <stop offset="100%" stop-color="${p.sun.fill}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="-400" y="-600" width="1600" height="1200" fill="url(#${gid})"/>
    <circle cx="${p.sun.cx}" cy="${p.sun.cy}" r="${p.sun.r * 3.4}" fill="url(#${sid})"/>
    <circle cx="${p.sun.cx}" cy="${p.sun.cy}" r="${p.sun.r}" fill="${p.sun.fill}" opacity="${p.sun.op}"/>
    ${p.far ? `<path d="${p.far.d}" fill="${p.far.fill}" opacity="${p.far.op}"/>` : ''}
    ${p.ridges.map((r, i) => `
      <path d="${r.d}" fill="${r.fill}"${
        i > 0 ? ` stroke="#ffffff" stroke-opacity="${0.16 - i * 0.03}" stroke-width="1.5"` : ''
      }/>
      ${/* Firnfelder gehören zum hintersten Grat und werden von den
            vorderen Rücken verdeckt — deshalb direkt danach. */ ''}
      ${i === 0 ? p.snow.map(d => `<path d="${d}" fill="#ffffff" opacity="0.5"/>`).join('') : ''}
    `).join('')}
  </svg>`;
}

// ── Masthead & Aufmacher ───────────────────────────────────────────────
function renderMasthead() {
  document.getElementById('mh-eyebrow').textContent = TRIP.eyebrow;
  document.getElementById('mh-issue').textContent   = TRIP.ausgabe;

  const parts = TRIP.title.split(' & ');
  document.getElementById('title').innerHTML = parts.length === 2
    ? `${esc(parts[0])}<br><span class="amp">&amp;</span> ${esc(parts[1])}`
    : esc(TRIP.title);

  document.getElementById('standfirst').textContent = TRIP.standfirst;
  document.getElementById('dateline').textContent   = TRIP.dateline;

  document.getElementById('colophon-left').textContent =
    `${START.name} → ${ETAPPEN.map(e => e.name).join(' → ')} → ${START.name}`;
  document.getElementById('colophon-right').textContent = TRIP.eyebrow;
}

// ── Kennzahlen ─────────────────────────────────────────────────────────
function renderStats() {
  const naechte  = ETAPPEN.reduce((s,e) => s + e.naechte, 0);
  const gefahren = ETAPPEN.reduce((s,e) => s + (parseInt(e.km,10) || 0), 0);

  const cells = [
    { val: ETAPPEN.length, lbl: 'Etappen' },
    { val: naechte,        lbl: 'Nächte' },
    { val: gefahren,       lbl: 'km einfache Strecke' },
    { val: 2,              lbl: 'Länder' },
  ];

  document.getElementById('stats').innerHTML = cells.map(c => `
    <div class="stat">
      <div class="stat-val">${esc(c.val)}</div>
      <div class="stat-lbl">${esc(c.lbl)}</div>
    </div>`).join('');
}

// ── Streckenband ───────────────────────────────────────────────────────
function renderRoute() {
  const cur = currentEtappe();
  const stops = [
    { name: START.name, sub: START.region, cls: 'is-start' },
    ...ETAPPEN.map(e => ({ name: e.name, sub: e.datesShort, cls: e.color, leg: e }))
  ];

  let html = '';
  stops.forEach((s, i) => {
    if (i > 0) {
      const e = s.leg;
      const val = e.km ? `${e.km} km · ${e.dauer}` : '—';
      html += `<div class="route-leg">
        <div class="leg-line"></div>
        <div class="leg-val">${esc(val)}</div>
      </div>`;
    }
    html += `<div class="route-stop ${s.cls}${cur && s.leg === cur ? ' current' : ''}">
      <div class="r-dot"></div>
      <div class="r-name">${esc(s.name)}</div>
      <div class="r-sub">${esc(s.sub)}</div>
    </div>`;
  });
  document.getElementById('route').innerHTML = html;
}

// ── Auszug: Countdown, laufende Reise, Rückblick ───────────────────────
function renderStand() {
  const wrap = document.getElementById('stand-wrap');
  const d = today();
  const cur = currentEtappe();
  const nxt = nextEtappe();

  if (d < TRIP.start) {
    wrap.innerHTML = `
      <div class="pullout">
        <div class="pullout-num">${daysBetween(d, TRIP.start)}</div>
        <div class="pullout-txt">Tage bis zur Abfahrt — am 11. September geht es über die A7 nach Süden.</div>
      </div>`;
    return;
  }

  if (d >= TRIP.end) {
    const naechte = ETAPPEN.reduce((s,e) => s + e.naechte, 0);
    wrap.innerHTML = `
      <div class="pullout">
        <div class="pullout-num">✓</div>
        <div class="pullout-txt">Reise abgeschlossen — ${naechte} Nächte zwischen Isarwinkel und Valtellina.</div>
      </div>`;
    return;
  }

  if (!cur) { wrap.innerHTML = ''; return; }

  const nacht = daysBetween(cur.start, d) + 1;
  const offen = daysBetween(d, cur.end);
  wrap.innerHTML = `
    <div class="now ${cur.color}-accent">
      <div class="section-tag">Heute · Tag ${daysBetween(TRIP.start, d)+1}</div>
      <div class="now-name">${esc(cur.name)}</div>
      <div class="info-region">${esc(cur.region)}</div>
      <div class="now-grid">
        <div class="fact"><div class="fact-lbl">Unterkunft</div><div class="fact-val">${esc(cur.unterkunft)}</div></div>
        <div class="fact"><div class="fact-lbl">Nacht</div><div class="fact-val">${nacht} von ${cur.naechte}</div></div>
        <div class="fact"><div class="fact-lbl">Morgen</div><div class="fact-val">${
          offen > 0 ? `noch ${offen} Nacht${offen > 1 ? 'e' : ''}` : `Abreise → ${nxt ? esc(nxt.name) : 'Heimreise'}`
        }</div></div>
      </div>
    </div>`;
}

// ── Wetterbericht ──────────────────────────────────────────────────────
async function renderWetter() {
  const wrap = document.getElementById('wetter-wrap');
  const cur = currentEtappe();
  if (!wrap || !cur) return;

  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${cur.lat}&longitude=${cur.lng}` +
      `&current=temperature_2m,weathercode,windspeed_10m,precipitation` +
      `&daily=temperature_2m_max,temperature_2m_min,weathercode` +
      `&timezone=Europe/Berlin&forecast_days=3`
    );
    const data = await res.json();
    const c = data.current, dd = data.daily;

    const wort = code => {
      if (code === 0) return 'Klar';
      if (code <= 3)  return 'Bewölkt';
      if (code <= 48) return 'Nebel';
      if (code <= 67) return 'Regen';
      if (code <= 77) return 'Schnee';
      if (code <= 82) return 'Schauer';
      return 'Gewitter';
    };
    const tage = ['So','Mo','Di','Mi','Do','Fr','Sa'];

    wrap.innerHTML = `
      <div class="wetter">
        <div class="section-tag">Wetterbericht · ${esc(cur.name)}</div>
        <div class="wetter-now">
          <div class="wetter-temp">${Math.round(c.temperature_2m)}°</div>
          <div>
            <div style="font-size:16px;">${wort(c.weathercode)}</div>
            <div class="mono" style="margin-top:4px;">Wind ${Math.round(c.windspeed_10m)} km/h · Niederschlag ${c.precipitation} mm</div>
          </div>
        </div>
        <div class="wetter-days">
          ${[0,1,2].map(i => {
            const date = new Date(dd.time[i]);
            return `<div class="wetter-day">
              <div class="mono">${tage[date.getDay()]}</div>
              <div class="wetter-hi">${Math.round(dd.temperature_2m_max[i])}°</div>
              <div class="wetter-lo">${Math.round(dd.temperature_2m_min[i])}° · ${wort(dd.weathercode[i])}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  } catch (e) {
    // Wetter ist Beiwerk — bei Netzfehler bleibt die Sektion leer.
  }
}

// ── Termine als Inhaltsverzeichnis ─────────────────────────────────────
function renderToc() {
  const d = today();
  const sorted = [...KALENDER].sort((a,b) => a.date - b.date);
  const nextIdx = sorted.findIndex(k => k.date >= d);

  document.getElementById('toc-list').innerHTML = sorted.map((k, i) => `
    <div class="toc-row ${k.date < d ? 'past' : ''} ${i === nextIdx ? 'next' : ''}">
      <div class="toc-num">Nº ${String(i+1).padStart(2,'0')}</div>
      <div class="toc-date">${esc(k.datum)}</div>
      <div class="toc-label">${esc(k.label)}</div>
    </div>`).join('');
}

// ── Etappen-Spreads ────────────────────────────────────────────────────
function highlightsHtml(id) {
  const h = HIGHLIGHTS[id];
  if (!h) return '';

  const gruppen = [
    { key: 'wandern',     lbl: 'Zu Fuß ab der Haustür' },
    { key: 'restaurants', lbl: 'Tisch & Einkehr' },
    { key: 'besonderes',  lbl: 'Besonderes' },
  ].filter(g => Array.isArray(h[g.key]) && h[g.key].length);

  if (!gruppen.length) return '';

  return `<div class="hl">` + gruppen.map(g => `
    <div class="hl-group">
      <div class="hl-lbl">${g.lbl}</div>
      ${h[g.key].map((item, i) => `
        <div class="hl-item">
          <div class="hl-marker">${String(i+1).padStart(2,'0')}</div>
          <div>
            <div class="hl-name">${esc(item.name)}</div>
            ${item.info ? `<div class="hl-info">${esc(item.info)}</div>` : ''}
          </div>
        </div>`).join('')}
    </div>`).join('') + `</div>`;
}

function renderSpreads() {
  document.getElementById('spreads').innerHTML = ETAPPEN.map((e, i) => {
    const bild = e.foto
      ? `<img class="shot" src="${esc(e.foto)}" alt="${esc(e.name)}">`
      : panoramaSvg(e.color, e.id);
    const caption = e.foto ? (e.fotoCredit || e.name) : e.illuCaption;

    const facts = [
      { lbl: 'Unterkunft', val: esc(e.unterkunft) },
      { lbl: 'Nächte',     val: e.naechte },
      { lbl: 'Adresse',    val: esc(e.adresse), wide: true },
      { lbl: 'Check-in',   val: esc(e.checkin), wide: e.checkin.length > 30 },
      { lbl: 'Check-out',  val: esc(e.checkout) },
      { lbl: 'Buchung',    val: `${e.buchungNr ? `<span class="code">${esc(e.buchungNr)}</span> · ` : ''}${esc(e.buchungPlattform)}` },
    ];
    if (e.wlan) {
      facts.push({
        lbl: 'WLAN',
        val: `${esc(e.wlan.ssid)}<br><span class="code">${esc(e.wlan.passwort)}</span>`,
        wide: true,
      });
    }

    return `
    <article class="spread ${i % 2 === 1 ? 'reverse' : ''} reveal">
      <div class="photo">
        ${bild}
        <div class="photo-num">${String(e.id).padStart(2,'0')}</div>
        <div class="photo-caption">${esc(caption)}</div>
      </div>
      <!-- Beide Kopien liegen im Spread, damit sie exakt deckungsgleich sitzen. -->
      <div class="crossname on-photo">${esc(e.name)}</div>
      <div class="crossname on-paper" aria-hidden="true">${esc(e.name)}</div>
      <div class="info ${e.color}-accent">
        <div class="info-anfahrt">Anfahrt ${e.km ? `${esc(e.km)} km · ${esc(e.dauer)}` : 'offen'}</div>
        <div class="info-region">${esc(e.region)} · ${esc(e.dates)}</div>
        <div class="info-teaser">${esc(e.teaser)}</div>
        <div class="facts">
          ${facts.map(f => `
            <div class="fact${f.wide ? ' wide' : ''}">
              <div class="fact-lbl">${f.lbl}</div>
              <div class="fact-val">${f.val}</div>
            </div>`).join('')}
        </div>
        <div class="fact"><div class="fact-lbl">Notiz</div><div class="fact-val">${esc(e.info)}</div></div>
        ${highlightsHtml(e.id)}
        <div class="actions">
          <a class="btn" href="${esc(e.navUrl)}" target="_blank" rel="noopener"><span>Navigation</span></a>
          ${e.buchungUrl ? `<a class="btn" href="${esc(e.buchungUrl)}" target="_blank" rel="noopener"><span>Buchung</span></a>` : ''}
        </div>
      </div>
    </article>`;
  }).join('');

  observeReveals();
}

// ── Karte ──────────────────────────────────────────────────────────────
function renderKarte() {
  const [a, b] = ETAPPEN;
  const src = `https://www.google.com/maps/embed/v1/directions?key=${CONFIG.mapsApiKey}`
    + `&origin=${encodeURIComponent(a.adresse)}`
    + `&destination=${encodeURIComponent(b.adresse)}`
    + `&mode=driving&language=de`;
  document.getElementById('figure-frame').innerHTML =
    `<iframe src="${src}" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>`;

  const orte = [
    { name: START.name, sub: START.adresse,  url: START.navUrl },
    ...ETAPPEN.map(e => ({ name: e.name, sub: `${e.unterkunft} · ${e.adresse}`, url: e.navUrl })),
  ];

  document.getElementById('vz-list').innerHTML = orte.map((o, i) => `
    <a class="vz-row" href="${esc(o.url)}" target="_blank" rel="noopener">
      <div class="vz-num">${String(i).padStart(2,'0')}</div>
      <div>
        <div class="vz-name">${esc(o.name)}</div>
        <div class="vz-sub">${esc(o.sub)}</div>
      </div>
      <div class="vz-nav">Route →</div>
    </a>`).join('');
}

// ── Auftritt beim Scrollen ─────────────────────────────────────────────
let revealObserver = null;
function observeReveals() {
  const items = document.querySelectorAll('.reveal:not(.in)');
  if (!('IntersectionObserver' in window)) {
    items.forEach(el => el.classList.add('in'));
    return;
  }
  if (!revealObserver) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => {
        if (en.isIntersecting) { en.target.classList.add('in'); obs.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -12% 0px' });
  }
  items.forEach(el => revealObserver.observe(el));
  // Sicherheitsnetz: Inhalt darf nie an der Animation hängen bleiben.
  setTimeout(() => items.forEach(el => el.classList.add('in')), 2500);
}

// ── Navigation & Ausgabe ───────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.rub').forEach(b => b.classList.remove('active'));
  document.getElementById(`s-${name}`).classList.add('active');
  btn.classList.add('active');
  window.scrollTo(0, 0);
  observeReveals();
}

function toggleTheme() {
  const root = document.documentElement;
  const night = root.getAttribute('data-theme') === 'night';
  root.setAttribute('data-theme', night ? 'tag' : 'night');
  document.getElementById('theme-btn').textContent = night ? 'Nachtausgabe' : 'Tagausgabe';
}

// ── Satz & Druck ───────────────────────────────────────────────────────
function renderAll() {
  renderMasthead();
  renderStats();
  renderRoute();
  renderStand();
  renderWetter();
  renderToc();
  renderSpreads();
  renderKarte();
}

renderAll();
</script>
