<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>L&V 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-brand">
    <div class="topbar-pulse"></div>
    <div>
      <div class="topbar-title">L&V · 2026</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="topbar-sub" id="topbar-date"></div>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Theme">◑</button>
  </div>
</header>

<!-- ══ START ══════════════════════════════════════════════ -->
<div class="section active" id="s-overview">
  <div class="overview-wrap">
    <div class="hero">
      <div class="hero-label">Roadtrip</div>
      <div class="hero-title">LENGGRIES<br>&amp; <span>VALDIDENTRO</span></div>
      <div class="hero-sub">11. Sept. – 26. Sept. 2026 · Tesla · 🐾</div>
      <div class="stats-row">
        <div class="stat"><div class="stat-val">2</div><div class="stat-lbl">Etappen</div></div>
        <div class="stat"><div class="stat-val">15</div><div class="stat-lbl">Nächte</div></div>
        <div class="stat"><div class="stat-val">2</div><div class="stat-lbl">Länder</div></div>
        <div class="stat"><div class="stat-val" id="days-stat">—</div><div class="stat-lbl" id="days-lbl">Tage</div></div>
      </div>
    </div>
    <div class="today-wrap" id="today-wrap"></div>
    <div id="weather-wrap"></div>
    <div class="route-wrap">
      <div class="section-tag">Route</div>
      <div class="route-line" id="route-line"></div>
    </div>
    <div style="margin:18px 24px 0;" id="kalender-wrap"></div>

  </div>
</div>

<!-- ══ ETAPPEN ════════════════════════════════════════════ -->
<div class="section" id="s-etappen">
  <div class="etappen-wrap">
    <div style="padding:20px 24px 16px;">
      <div class="page-title">Etappen</div>
      <div class="page-sub">Alle Stopps — Navigation & Details</div>
    </div>
    <!-- Progress map -->
    <div class="progress-map">
      <div class="progress-map-inner">
        <div class="section-tag">Fortschritt</div>
        <div class="progress-steps" id="progress-steps"></div>
      </div>
    </div>
    <div id="etappen-list"></div>
  </div>
</div>

<!-- ══ KARTE ══════════════════════════════════════════════ -->
<div class="section" id="s-karte">
  <div class="karte-wrap">
    <!-- Karten-Embed -->
    <div class="maps-embed-card">
      <div class="card-header-bar">
        <div>
          <div class="card-header-title">Reiseorte</div>
          <div class="card-header-sub">Lenggries → Valdidentro</div>
        </div>
        <div id="maps-link-slot"></div>
      </div>
      <div class="maps-iframe-wrap" style="height:380px;" id="maps-embed-wrap"></div>
    </div>
    <!-- Navigation shortcuts -->
    <div class="maps-embed-card">
      <div class="card-header-bar">
        <div>
          <div class="card-header-title">Navigation</div>
          <div class="card-header-sub">Direkt zu den Unterkünften</div>
        </div>
      </div>
      <div class="nav-list" id="nav-list"></div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('overview',this)">
    <span class="nav-ico">⬡</span><span class="nav-lbl">Start</span>
  </button>
  <button class="nav-item" onclick="switchTab('etappen',this)">
    <span class="nav-ico">◎</span><span class="nav-lbl">Etappen</span>
  </button>
  <button class="nav-item" onclick="switchTab('karte',this)">
    <span class="nav-ico">◉</span><span class="nav-lbl">Karte</span>
  </button>

</nav>

<script src="data.js"></script>
<script>
// ═══════════════════════════════════════════════════════
//  APP
// ═══════════════════════════════════════════════════════

// ── HELPERS ───────────────────────────────────────────────────────────────────
function today() { const d=new Date(); d.setHours(0,0,0,0); return d; }
function daysBetween(a,b) { return Math.round((b-a)/86400000); }

function currentEtappe() {
  const d=today();
  return ETAPPEN.find(e=>{
    const s=new Date(e.start); s.setHours(0,0,0,0);
    const en=new Date(e.end);  en.setHours(0,0,0,0);
    return d>=s && d<en;
  });
}

function nextEtappe() {
  const d=today();
  return ETAPPEN.find(e=>{ const s=new Date(e.start); s.setHours(0,0,0,0); return s>d; });
}

// ── TOPBAR DATE ───────────────────────────────────────────────────────────────
function renderTopbarDate() {
  const d = new Date();
  document.getElementById('topbar-date').textContent =
    d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' });
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const d = today();
  const stat = document.getElementById('days-stat');
  const lbl  = document.getElementById('days-lbl');
  if (d < TRIP.start) {
    const days = daysBetween(d, TRIP.start);
    stat.textContent = days;
    lbl.textContent = 'Tage noch';
  } else if (d >= TRIP.end) {
    stat.textContent = '✓';
    lbl.textContent = 'Fertig';
  } else {
    stat.textContent = daysBetween(TRIP.start, d) + 1;
    lbl.textContent = 'Tag';
  }
}

// ── TODAY CARD ────────────────────────────────────────────────────────────────
function renderToday() {
  const wrap = document.getElementById('today-wrap');
  const d = today();
  const cur = currentEtappe();
  const nxt = nextEtappe();
  const daysToStart = daysBetween(d, TRIP.start);

  if (d < TRIP.start) {
    wrap.innerHTML = `
      <div class="countdown-card">
        <div class="countdown-num">${daysToStart}</div>
        <div class="countdown-label">Tage bis zur Abfahrt · 11. September 2026</div>
      </div>`;
    return;
  }

  if (d >= TRIP.end) {
    wrap.innerHTML = `
      <div class="countdown-card">
        <div class="countdown-num" style="font-size:60px;">L&V ✓</div>
        <div class="countdown-label">Reise abgeschlossen · 15 Nächte</div>
      </div>`;
    return;
  }

  if (cur) {
    const nightNum = daysBetween(cur.start, d) + 1;
    const nightsLeft = daysBetween(d, cur.end);

    wrap.innerHTML = `
      <div class="today-card">
        <div class="today-inner">
          <div class="today-tag" style="color:${cur.color}">// Aktuell · Tag ${daysBetween(TRIP.start,d)+1}</div>
          <div class="today-location" style="color:${cur.color}">${cur.name}</div>
          <div class="today-region">${cur.region}</div>
          <div class="today-grid">
            <div class="today-cell">
              <div class="today-cell-label">Unterkunft</div>
              <div class="today-cell-val">${cur.unterkunft}</div>
            </div>
            <div class="today-cell">
              <div class="today-cell-label">Nacht</div>
              <div class="today-cell-val">${nightNum} / ${cur.naechte}</div>
            </div>
            <div class="today-cell">
              <div class="today-cell-label">Morgen</div>
              <div class="today-cell-val">${nightsLeft>0?`noch ${nightsLeft} Nacht${nightsLeft>1?'e':''}`:`Abreise → ${nxt?nxt.name:'–'}`}</div>
            </div>
          </div>
        </div>
      </div>`;
  }
}

// ── ROUTE ─────────────────────────────────────────────────────────────────────
function renderRoute() {
  const cur = currentEtappe();
  const kms = ETAPPEN.map(e => e.km ? `${e.km} km` : '');
  const stops = [
    { name:'Start', color:'#3a5566', active:false },
    ...ETAPPEN.map(e => ({ name:e.name, color:e.color, active:cur===e }))
  ];

  let html = '';
  stops.forEach((s,i) => {
    const cls = s.active ? ' active' : '';
    html += `<div class="route-stop">
      <div class="route-dot${cls}" style="color:${s.color}"></div>
      <div class="route-name${cls}" style="${s.active?'color:'+s.color:''}">${s.name}</div>
    </div>`;
    if (i < stops.length-1)
      html += `<div class="route-conn" data-km="${kms[i]||''}"></div>`;
  });
  document.getElementById('route-line').innerHTML = html;
}

// ── KALENDER ──────────────────────────────────────────────────────────────────
function renderKalender() {
  const wrap = document.getElementById('kalender-wrap');
  if (!wrap) return;

  const d = today();
  const rows = [...KALENDER]
    .sort((a,b) => a.date - b.date)
    .map(k => {
      const past = k.date < d;
      return `
      <div style="display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);${past?'opacity:0.45;':''}">
        <div style="min-width:82px;flex-shrink:0;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.04em;color:var(--cyan);">${k.datum}</div>
        <div style="font-size:16px;color:var(--text);line-height:1.4;">${k.label}</div>
      </div>`;
    }).join('');

  wrap.innerHTML = `
    <div class="section-tag">Kalender</div>
    <div style="background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-lg);padding:0 18px;">
      ${rows}
    </div>`;
}

// ── PROGRESS MAP ──────────────────────────────────────────────────────────────
function renderProgress() {
  const d = today();
  const cur = currentEtappe();

  document.getElementById('progress-steps').innerHTML = ETAPPEN.map(e => {
    const isDone = d >= new Date(e.end);
    const isCur  = cur === e;
    const cls = isCur ? 'current' : isDone ? 'done' : '';
    return `
      <div class="prog-step ${cls}" onclick="openEtappe(${e.id-1})">
        <div class="prog-dot">${e.id}</div>
        <div class="prog-label">${e.name}</div>
      </div>`;
  }).join('');
}

// ── WEATHER ───────────────────────────────────────────────────────────────────
async function renderWeather() {
  const wrap = document.getElementById('weather-wrap');
  if (!wrap) return;

  const cur = currentEtappe();
  if (!cur) return;

  const lat = cur.lat, lng = cur.lng;

  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weathercode,windspeed_10m,precipitation&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_sum&timezone=Europe/Berlin&forecast_days=3`
    );
    const data = await res.json();
    const c = data.current;
    const d = data.daily;

    const wIcon = code => {
      if (code===0) return '☀️';
      if (code<=3) return '⛅';
      if (code<=48) return '🌫️';
      if (code<=67) return '🌧️';
      if (code<=77) return '🌨️';
      if (code<=82) return '🌦️';
      return '⛈️';
    };

    const days = ['So','Mo','Di','Mi','Do','Fr','Sa'];

    wrap.innerHTML = `
      <div style="margin:16px 24px 0;">
        <div class="section-tag">Wetter · ${cur.name}</div>
        <div style="background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-lg);overflow:hidden;">
          <!-- Current -->
          <div style="padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);">
            <div style="font-size:40px;line-height:1;">${wIcon(c.weathercode)}</div>
            <div>
              <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:0.04em;color:var(--cyan);">${Math.round(c.temperature_2m)}°C</div>
              <div style="font-size:12px;letter-spacing:0.08em;color:var(--text3);">WIND ${Math.round(c.windspeed_10m)} km/h · REGEN ${c.precipitation} mm</div>
            </div>
          </div>
          <!-- 3-day forecast -->
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);">
            ${[0,1,2].map(i => {
              const date = new Date(d.time[i]);
              return `<div style="background:var(--panel2);padding:12px 10px;text-align:center;">
                <div style="font-size:10px;letter-spacing:0.15em;color:var(--text3);margin-bottom:4px;">${days[date.getDay()]}</div>
                <div style="font-size:20px;margin-bottom:4px;">${wIcon(d.weathercode[i])}</div>
                <div style="font-size:13px;color:var(--text);font-weight:700;">${Math.round(d.temperature_2m_max[i])}°</div>
                <div style="font-size:11px;color:var(--text3);">${Math.round(d.temperature_2m_min[i])}°</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>`;
  } catch(e) {
    // Silently fail — weather is optional
  }
}

// ── HIGHLIGHTS ────────────────────────────────────────────────────────────────
// HIGHLIGHTS ist derzeit leer (siehe HIGHLIGHTS_EINGANG.md) — dann rendert
// diese Funktion nichts.
function highlightsHtml(etappeId) {
  const h = HIGHLIGHTS[etappeId];
  if (!h) return '';

  const top3 = (h.top3||[]).map(p => `
    <div style="padding:10px 0;border-bottom:1px solid var(--line);">
      <div style="font-size:17px;font-weight:700;color:var(--text);margin-bottom:2px;">◦ ${p.name}</div>
      <div style="font-size:15px;color:var(--text2);line-height:1.5;">${p.desc}</div>
    </div>`).join('');

  const wandern = (h.wandern||[]).map(w => `
    <div style="font-size:16px;color:var(--text2);padding:4px 0 4px 16px;position:relative;line-height:1.5;">
      <span style="position:absolute;left:0;color:var(--cyan);">›</span>${w}
    </div>`).join('');

  const spez = (h.spezialitaeten||[]).map(s => `
    <div style="font-size:16px;color:var(--text2);padding:4px 0 4px 16px;position:relative;line-height:1.5;">
      <span style="position:absolute;left:0;color:var(--cyan);">›</span>${s}
    </div>`).join('');

  return `
    ${top3 ? `<div class="body-section"><div class="body-label">⭐ Top 3 Highlights · Mit Hund</div>${top3}</div>` : ''}
    ${wandern ? `<div class="body-section"><div class="body-label">🥾 Wanderwege</div>${wandern}</div>` : ''}
    ${spez ? `<div class="body-section"><div class="body-label">🍽 Regionale Spezialitäten</div>${spez}</div>` : ''}
    ${h.nichtVerpassen ? `
    <div class="body-section" style="background:rgba(0,229,255,0.04);border-left:2px solid var(--cyan);padding-left:16px;">
      <div class="body-label">🚩 Nicht verpassen</div>
      <div class="body-val dim" style="font-size:17px;">${h.nichtVerpassen}</div>
    </div>` : ''}`;
}

// ── ETAPPEN ───────────────────────────────────────────────────────────────────
function renderEtappen() {
  document.getElementById('etappen-list').innerHTML = ETAPPEN.map((e,i) => {
    const driveCells = [
      e.km    ? `<div class="drive-cell"><div class="drive-val">${e.km}</div><div class="drive-lbl">km</div></div>` : '',
      e.dauer ? `<div class="drive-cell"><div class="drive-val">${e.dauer}</div><div class="drive-lbl">Fahrt</div></div>` : '',
      `<div class="drive-cell"><div class="drive-val">${e.naechte}</div><div class="drive-lbl">Nächte</div></div>`,
    ].join('');

    return `
    <div class="etappe-card" id="card-${i}">
      <div class="card-accent" style="background:${e.color}"></div>
      <div class="drive-bar">${driveCells}</div>
      <div class="card-head" onclick="toggleCard(${i})">
        <div class="card-num" style="color:${e.color}">${String(e.id).padStart(2,'0')}</div>
        <div class="card-info">
          <div class="card-name" style="color:${e.color}">${e.name}</div>
          <div class="card-region">${e.region}</div>
        </div>
        <div class="card-right">
          <div class="card-dates">${e.dates}</div>
          <div class="card-chevron">↓</div>
        </div>
      </div>
      <div class="card-body">
        <div class="body-section">
          <div class="body-label">Unterkunft</div>
          <div class="body-val">${e.unterkunft}</div>
          <div class="body-val dim" style="margin-top:4px;">${e.adresse}</div>
        </div>
        <div class="body-section">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><div class="body-label">Check-in</div><div class="body-val">${e.checkin}</div></div>
            <div><div class="body-label">Check-out</div><div class="body-val">${e.checkout}</div></div>
          </div>
          <div style="margin-top:12px;">
            <div class="booking-badge">✓ ${e.buchungNr ? `${e.buchungNr} · ` : ''}${e.buchungPlattform}</div>
          </div>
        </div>
        <div class="body-section">
          <div class="body-val dim">${e.info}</div>
        </div>
        ${highlightsHtml(e.id)}
        <div class="action-row">
          <a class="act-btn nav" href="${e.navUrl}" target="_blank">
            <span class="act-ico">🗺</span>
            <span class="act-lbl">Navigation</span>
          </a>
          ${e.buchungUrl ? `
          <a class="act-btn book" href="${e.buchungUrl}" target="_blank">
            <span class="act-ico">🔖</span>
            <span class="act-lbl">Buchung</span>
          </a>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── KARTE ─────────────────────────────────────────────────────────────────────
function renderMapEmbed() {
  const wrap = document.getElementById('maps-embed-wrap');
  if (!wrap) return;

  const [a, b] = ETAPPEN;
  const src = `https://www.google.com/maps/embed/v1/directions?key=${CONFIG.mapsApiKey}`
    + `&origin=${encodeURIComponent(a.adresse)}`
    + `&destination=${encodeURIComponent(b.adresse)}`
    + `&mode=driving&language=de`;

  wrap.innerHTML = `
    <iframe src="${src}" width="100%" height="380" allowfullscreen loading="lazy"
      style="border:none;display:block;"></iframe>`;

  const slot = document.getElementById('maps-link-slot');
  if (slot) {
    slot.innerHTML = CONFIG.mapsListUrl
      ? `<a class="maps-link-btn" href="${CONFIG.mapsListUrl}" target="_blank">📍 Öffnen</a>`
      : '';
  }
}

function renderNavList() {
  document.getElementById('nav-list').innerHTML = ETAPPEN.map(e => `
    <a class="nav-list-row" href="${e.navUrl}" target="_blank">
      <div class="nav-dot" style="background:${e.color}"></div>
      <div>
        <div class="nav-name">${e.name}</div>
        <div class="nav-sub">${e.unterkunft}</div>
      </div>
      <div class="nav-arrow">NAV →</div>
    </a>`).join('');
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function toggleCard(i) { document.getElementById(`card-${i}`).classList.toggle('open'); }

function openEtappe(i) {
  switchTab('etappen', document.querySelectorAll('.nav-item')[1]);
  setTimeout(() => {
    const card = document.getElementById(`card-${i}`);
    card?.classList.add('open');
    card?.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 100);
}

function switchTab(name, btn) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById(`s-${name}`).classList.add('active');
  btn.classList.add('active');
  window.scrollTo(0,0);
}

function toggleTheme() {
  const html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme')==='dark'?'light':'dark');
}

// ── RENDER ALL ────────────────────────────────────────────────────────────────
function renderAll() {
  renderTopbarDate();
  renderStats();
  renderToday();
  renderWeather();
  renderRoute();
  renderKalender();
  renderProgress();
  renderEtappen();
  renderMapEmbed();
  renderNavList();
}

renderAll();
</script>
</body>
</html>
