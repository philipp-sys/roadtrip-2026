<script>
// ═══════════════════════════════════════════════════════
//  APP

let docData = {};
let chatHistory = [];

// ── HELPERS ───────────────────────────────────────────────────────────────────
function today() { const d=new Date(); d.setHours(0,0,0,0); return d; }
function daysBetween(a,b) { return Math.round((b-a)/86400000); }

function currentEtappe() {
  const d=today();
  return ETAPPEN.find(e=>{
    const s=new Date(e.start); s.setHours(0,0,0,0);
    const en=new Date(e.end);  en.setHours(0,0,0,0);
    return d>=s && d<en;
  });
}

function nextEtappe() {
  const d=today();
  return ETAPPEN.find(e=>{ const s=new Date(e.start); s.setHours(0,0,0,0); return s>d; });
}

// ── TOPBAR DATE ───────────────────────────────────────────────────────────────
function renderTopbarDate() {
  const d = new Date();
  document.getElementById('topbar-date').textContent =
    d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' });
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const d = today();
  const stat = document.getElementById('days-stat');
  const lbl  = document.getElementById('days-lbl');
  if (d < TRIP.start) {
    const days = daysBetween(d, TRIP.start);
    stat.textContent = days;
    lbl.textContent = 'Tage noch';
  } else if (d >= TRIP.end) {
    stat.textContent = '✓';
    lbl.textContent = 'Fertig';
  } else {
    stat.textContent = daysBetween(TRIP.start, d) + 1;
    lbl.textContent = 'Tag';
  }
}

// ── TODAY CARD ────────────────────────────────────────────────────────────────
function renderToday() {
  const wrap = document.getElementById('today-wrap');
  const d = today();
  const cur = currentEtappe();
  const nxt = nextEtappe();
  const daysToStart = daysBetween(d, TRIP.start);

  if (d < TRIP.start) {
    wrap.innerHTML = `
      <div class="countdown-card">
        <div class="countdown-num">${daysToStart}</div>
        <div class="countdown-label">Tage bis zur Abfahrt · 13. Mai 2026</div>
      </div>`;
    return;
  }

  if (d >= TRIP.end) {
    wrap.innerHTML = `
      <div class="countdown-card">
        <div class="countdown-num" style="font-size:60px;">B&N ✓</div>
        <div class="countdown-label">Reise abgeschlossen · 1710 km</div>
      </div>`;
    return;
  }

  if (cur) {
    const doc = docData[cur.id] || {};
    const nightNum = daysBetween(cur.start, d) + 1;
    const nightsLeft = daysBetween(d, cur.end);
    const firstRest = doc.restaurants
      ? doc.restaurants.split('\n').filter(l=>l.trim()&&l!=='—')[0]?.replace(/^-\s*/,'')
      : null;

    wrap.innerHTML = `
      <div class="today-card">
        <div class="today-inner">
          <div class="today-tag" style="color:${cur.color}">// Aktuell · Tag ${daysBetween(TRIP.start,d)+1}</div>
          <div class="today-location" style="color:${cur.color}">${cur.name}</div>
          <div class="today-region">${cur.region}</div>
          <div class="today-grid">
            <div class="today-cell">
              <div class="today-cell-label">Unterkunft</div>
              <div class="today-cell-val">${cur.unterkunft}</div>
            </div>
            <div class="today-cell">
              <div class="today-cell-label">Nacht</div>
              <div class="today-cell-val">${nightNum} / ${cur.naechte}</div>
            </div>
            ${firstRest ? `
            <div class="today-cell">
              <div class="today-cell-label">Restaurant</div>
              <div class="today-cell-val">${firstRest}</div>
            </div>` : ''}
            <div class="today-cell">
              <div class="today-cell-label">Morgen</div>
              <div class="today-cell-val">${nightsLeft>0?`noch ${nightsLeft} Nacht${nightsLeft>1?'e':''}`:`Abreise → ${nxt?nxt.name:'–'}`}</div>
            </div>
          </div>
        </div>
      </div>`;
  }
}

// ── ROUTE ─────────────────────────────────────────────────────────────────────
function renderRoute() {
  const d = today();
  const cur = currentEtappe();
  const kms = ['460 km','420 km','330 km','500 km'];
  const stops = [
    { name:'Start', color:'#3a5566', active:false },
    ...ETAPPEN.map(e => ({ name:e.name, color:e.color, active:cur===e }))
  ];

  let html = '';
  stops.forEach((s,i) => {
    const cls = s.active ? ' active' : '';
    html += `<div class="route-stop">
      <div class="route-dot${cls}" style="color:${s.color}"></div>
      <div class="route-name${cls}" style="${s.active?'color:'+s.color:''}">${s.name}</div>
    </div>`;
    if (i < stops.length-1)
      html += `<div class="route-conn" data-km="${kms[i]||''}"></div>`;
  });
  document.getElementById('route-line').innerHTML = html;
}

// ── PROGRESS MAP ──────────────────────────────────────────────────────────────
function renderProgress() {
  const d = today();
  const cur = currentEtappe();

  document.getElementById('progress-steps').innerHTML = ETAPPEN.map(e => {
    const isDone = d >= new Date(e.end);
    const isCur  = cur === e;
    const cls = isCur ? 'current' : isDone ? 'done' : '';
    return `
      <div class="prog-step ${cls}" onclick="openEtappe(${e.id-1})">
        <div class="prog-dot">${e.id}</div>
        <div class="prog-label">${e.name}</div>
      </div>`;
  }).join('');
}

// ── WEATHER ───────────────────────────────────────────────────────────────────
async function renderWeather() {
  const wrap = document.getElementById('weather-wrap');
  if (!wrap) return;

  const cur = currentEtappe();
  if (!cur) return;

  const lat = cur.lat, lng = cur.lng;

  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weathercode,windspeed_10m,precipitation&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_sum&timezone=Europe/Paris&forecast_days=3`
    );
    const data = await res.json();
    const c = data.current;
    const d = data.daily;

    const wIcon = code => {
      if (code===0) return '☀️';
      if (code<=3) return '⛅';
      if (code<=48) return '🌫️';
      if (code<=67) return '🌧️';
      if (code<=77) return '🌨️';
      if (code<=82) return '🌦️';
      return '⛈️';
    };

    const days = ['So','Mo','Di','Mi','Do','Fr','Sa'];

    wrap.innerHTML = `
      <div style="margin:16px 24px 0;">
        <div class="section-tag">Wetter · ${cur.name}</div>
        <div style="background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-lg);overflow:hidden;">
          <!-- Current -->
          <div style="padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);">
            <div style="font-size:40px;line-height:1;">${wIcon(c.weathercode)}</div>
            <div>
              <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:0.04em;color:var(--cyan);">${Math.round(c.temperature_2m)}°C</div>
              <div style="font-size:12px;letter-spacing:0.08em;color:var(--text3);">WIND ${Math.round(c.windspeed_10m)} km/h · REGEN ${c.precipitation} mm</div>
            </div>
          </div>
          <!-- 3-day forecast -->
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);">
            ${[0,1,2].map(i => {
              const date = new Date(d.time[i]);
              return `<div style="background:var(--panel2);padding:12px 10px;text-align:center;">
                <div style="font-size:10px;letter-spacing:0.15em;color:var(--text3);margin-bottom:4px;">${days[date.getDay()]}</div>
                <div style="font-size:20px;margin-bottom:4px;">${wIcon(d.weathercode[i])}</div>
                <div style="font-size:13px;color:var(--text);font-weight:700;">${Math.round(d.temperature_2m_max[i])}°</div>
                <div style="font-size:11px;color:var(--text3);">${Math.round(d.temperature_2m_min[i])}°</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>`;
  } catch(e) {
    // Silently fail — weather is optional
  }
}

// ── DOC PARSING ───────────────────────────────────────────────────────────────
const KATMAP = {
  'unterkunft':'unterkunft','supermarkt':'supermarkt','restaurants':'restaurants',
  'wandern_/_ausflüge':'wandern','besonderheiten':'besonderheiten'
};

async function loadDoc() {
  try {
    const res = await fetch(CONFIG.docPubUrl + '?output=txt&t=' + Date.now());
    const text = await res.text();
    docData = parseDoc(text);
  } catch(e) {}
  renderAll();
}

function parseDoc(text) {
  const result = {};
  const lines = text.split('\n').map(l=>l.trim());
  let curEtappe=null, curKat=null, buf=[];
  const KATS = ['UNTERKUNFT','SUPERMARKT','RESTAURANTS','WANDERN / AUSFLÜGE','BESONDERHEITEN'];

  function flush() {
    if (curEtappe && curKat && buf.length) {
      const content = buf.filter(l=>l&&l!=='—').join('\n').trim();
      if (content) {
        if (!result[curEtappe]) result[curEtappe] = {};
        const k = curKat.toLowerCase().replace(' / ','_').replace(/ /g,'_');
        result[curEtappe][KATMAP[k]||k] = content;
      }
    }
    buf = [];
  }

  for (const line of lines) {
    const em = line.match(/==\s*ETAPPE\s*(\d+)\s*==/i);
    if (em) { flush(); curEtappe=parseInt(em[1]); curKat=null; continue; }
    if (line.match(/^---+$/)) { flush(); curKat=null; continue; }
    if (curEtappe) {
      const kat = KATS.find(k=>line===k);
      if (kat) { flush(); curKat=kat; continue; }
      if (curKat) buf.push(line);
    }
  }
  flush();
  return result;
}

        <div class="notiz-etappe-head">
          <div class="notiz-etappe-dot" style="background:${e.color}"></div>
          <div class="notiz-etappe-name" style="color:${e.color}">${e.name}</div>
          <div class="notiz-etappe-dates">${e.dates}</div>
        </div>
        ${kats.map(k => {
          const lines = k.data.split('\n').map(l=>l.trim()).filter(l=>l&&l!=='—');
          if (!lines.length) return '';
          const isList = lines.some(l=>l.startsWith('-'));
          const inner = isList
            ? `<ul class="notiz-kat-items">${lines.map(l=>`<li>${l.replace(/^-\s*/,'')}</li>`).join('')}</ul>`
            : `<div class="notiz-kat-items"><li>${lines.join('</li><li>')}</li></div>`;
          return `<div class="notiz-kat"><div class="notiz-kat-label">${k.lbl}</div>${inner}</div>`;
        }).join('')}
      </div>`;
  }).filter(Boolean).join('');

  el.innerHTML = blocks || `<div style="text-align:center;padding:32px;color:var(--text3);font-size:15px;letter-spacing:0.1em;">// KEINE NOTIZEN VORHANDEN</div>`;
}

async function saveNotiz() {
  const etappe  = document.getElementById('notiz-etappe').value;
  const kat     = document.getElementById('notiz-kat').value;
  const text    = document.getElementById('notiz-text').value.trim();
  const status  = document.getElementById('notiz-status');

  if (!text) { status.textContent = '// Text eingeben'; return; }

  status.textContent = '// Speichern…';
  const inhalt = text.startsWith('-') ? text : `- ${text}`;
  const result = await writeToDoc(parseInt(etappe), kat, inhalt);

  status.textContent = result || '// Gespeichert ✓';
  document.getElementById('notiz-text').value = '';
  if (result && !result.includes('Fehler')) setTimeout(()=>{ loadDoc(); status.textContent=''; }, 2000);
}

// ── DOC WRITE ─────────────────────────────────────────────────────────────────
async function writeToDoc(etappe, kategorie, inhalt) {
  const url = CONFIG.appsScriptUrl;
  if (!url) return 'Apps Script nicht konfiguriert';
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action:'write', etappe, kategorie, inhalt })
    });
    const data = await res.json();
    return data.success ? data.message : `Fehler: ${data.error}`;
  } catch(e) {
    return `Verbindungsfehler: ${e.message}`;
  }
}

// ── CHAT ──────────────────────────────────────────────────────────────────────
function buildSystemPrompt() {
  const d = today();
  const cur = currentEtappe();
  const loc = cur ? cur.name : 'außerhalb der Reise';
  const docSummary = Object.entries(docData).map(([num, data]) => {
    const e = ETAPPEN[num-1];
    if (!e) return '';
    const parts = [`[${e.name}]`];
    if (data.restaurants)    parts.push('Restaurants: ' + data.restaurants.split('\n').filter(l=>l.trim()).slice(0,3).join(', '));
    if (data.wandern)        parts.push('Wandern: ' + data.wandern.split('\n').filter(l=>l.trim()).slice(0,2).join(', '));
    if (data.besonderheiten) parts.push(data.besonderheiten.split('\n')[0]?.trim());
    return parts.filter(Boolean).join(' — ');
  }).filter(Boolean).join('\n');

  return `Reiseleiter für Bretagne/Normandie Roadtrip Mai 2026. Tesla + Hund.
Heute: ${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}. Standort: ${loc}.
Etappen: 1.Valenciennes(13-14.05) 2.Cotentin(14-19.05) 3.Crozon(19-25.05) 4.Alabasterküste(25-30.05).
Doc-Notizen: ${docSummary||'keine'}.
Antworte kurz, konkret, auf Deutsch. Nur reiserelevante Antworten.
Für Ortsuchen: gib <map_search>{"query":"...","lat":XX,"lng":XX}</map_search> aus.
Für Doc-Einträge: gib <doc_write>{"etappe":N,"kategorie":"RESTAURANTS","inhalt":"- Name: Info"}</doc_write> aus.`;
}

function addMsg(role, text) {
  const msgs = document.getElementById('chat-msgs');
  const t = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="msg-bubble">${text.replace(/\n/g,'<br>')}</div><div class="msg-time">${t}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  chatHistory.push({ role: role==='user'?'user':'assistant', content: text });
}

function addTyping() {
  const msgs = document.getElementById('chat-msgs');
  const div = document.createElement('div');
  div.id = 'typing'; div.className = 'typing-wrap';
  div.innerHTML = '<div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>';
  msgs.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = ''; input.style.height = 'auto';
  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  addMsg('user', text);
  addTyping();

  try {
    const messages = chatHistory.filter(m=>m.role==='user'||m.role==='assistant').slice(-8);
    const res = await fetch(CONFIG.workerUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': CONFIG.anthropicKey,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 1024,
        system: buildSystemPrompt(),
        messages
      })
    });

    document.getElementById('typing')?.remove();

    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      addMsg('ai', `Fehler: ${err?.error?.message || res.status}`);
      btn.disabled = false; return;
    }

    const data = await res.json();
    const reply = data.content?.filter(b=>b.type==='text').map(b=>b.text).join('') || '–';

    // Clean & process
    const clean = reply.replace(/<map_search>[\s\S]*?<\/map_search>/g,'').replace(/<doc_write>[\s\S]*?<\/doc_write>/g,'').trim();
    if (clean) addMsg('ai', clean);

    // Map search
    const mapMatches = [...reply.matchAll(/<map_search>([\s\S]*?)<\/map_search>/g)];
    mapMatches.forEach(m => {
      try { const p = JSON.parse(m[1].trim()); renderMapInChat(p.query, p.lat||48.5, p.lng||-2.5); } catch(e){}
    });

    // Doc writes
    const docMatches = [...reply.matchAll(/<doc_write>([\s\S]*?)<\/doc_write>/g)];
    for (const m of docMatches) {
      try {
        const p = JSON.parse(m[1].trim());
        const result = await writeToDoc(p.etappe, p.kategorie, p.inhalt);
        const msgs = document.getElementById('chat-msgs');
        const d = document.createElement('div');
        d.style.cssText = 'text-align:center;font-size:12px;color:var(--cyan);padding:4px;letter-spacing:0.06em;';
        d.textContent = result || '// Eingetragen';
        msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
        setTimeout(loadDoc, 1500);
      } catch(e){}
    }

  } catch(e) {
    document.getElementById('typing')?.remove();
    addMsg('ai', `// Verbindungsfehler: ${e.message}`);
  }

  btn.disabled = false;
}

function useChip(el) {
  document.getElementById('chat-input').value = el.textContent;
  sendMsg();
}

function doMapSearch() {
  const q = document.getElementById('map-search').value.trim();
  if (!q) return;
  const cur = currentEtappe();
  const lat = cur ? cur.lat : 48.5;
  const lng = cur ? cur.lng : -2.5;
  addMsg('user', `📍 ${q}`);
  renderMapInChat(q, lat, lng);
  document.getElementById('map-search').value = '';
}

function renderMapInChat(query, lat, lng) {
  const msgs = document.getElementById('chat-msgs');
  const ts = Date.now();
  const cur = currentEtappe();
  const etappeNum = cur ? ETAPPEN.indexOf(cur)+1 : 1;

  const div = document.createElement('div');
  div.style.cssText = 'width:100%;max-width:100%;align-self:flex-start;animation:fadeUp 0.25s ease;';

  div.innerHTML = `
    <div class="chat-map">
      <div class="chat-map-header">
        <span style="font-size:14px;">📍</span>
        <span class="chat-map-title">${query}</span>
        <a class="chat-map-open" href="https://www.google.com/maps/search/${encodeURIComponent(query)}/@${lat},${lng},14z" target="_blank">MAPS →</a>
      </div>
      <iframe src="https://www.google.com/maps/embed/v1/search?key=${CONFIG.mapsApiKey}&q=${encodeURIComponent(query)}&center=${lat},${lng}&zoom=14"
        width="100%" height="240" style="border:none;display:block;" allowfullscreen loading="lazy">
      </iframe>
      <div class="chat-map-save">
        <input class="save-input" id="si-${ts}" type="text" placeholder="Namen eingeben und speichern…"
          onkeydown="if(event.key==='Enter'){event.preventDefault();chatSave('si-${ts}',${etappeNum})}">
        <button class="save-btn" type="button" onclick="chatSave('si-${ts}',${etappeNum})">+ SAVE</button>
      </div>
    </div>`;

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function chatSave(inputId, etappeNum) {
  const input = document.getElementById(inputId);
  const name = input.value.trim();
  if (!name) return;

  input.disabled = true;
  const n = name.toLowerCase();
  let kat = 'BESONDERHEITEN';
  if (n.match(/restaurant|café|cafe|brasserie|crêperie|bistro|boulangerie|bar |auberge/)) kat='RESTAURANTS';
  else if (n.match(/supermarché|leclerc|carrefour|intermarché|lidl|aldi|marché/)) kat='SUPERMARKT';
  else if (n.match(/plage|pointe|cap |sentier|randonnée|phare|château|musée|parc/)) kat='WANDERN / AUSFLÜGE';

  const result = await writeToDoc(etappeNum, kat, `- ${name}`);

  const msgs = document.getElementById('chat-msgs');
  const d = document.createElement('div');
  d.style.cssText = 'text-align:center;font-size:12px;color:var(--cyan);padding:4px;letter-spacing:0.06em;';
  d.textContent = result || `// "${name}" gespeichert`;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;

  input.value = ''; input.disabled = false;
  if (result && !result.includes('Fehler')) setTimeout(loadDoc, 1500);
}

function initChat() {
  const msgs = document.getElementById('chat-msgs');
  const cur = currentEtappe();
  const d = today();
  let greeting;
  if (d < TRIP.start) {
    const days = daysBetween(d, TRIP.start);
    greeting = `// SYSTEM BEREIT\nNoch ${days} Tage bis zur Abfahrt.\n\nFrag mich nach Aktivitäten, Restaurants oder Tipps. Ich kann auch Notizen ins Reisedokument schreiben.`;
  } else if (cur) {
    greeting = `// STANDORT: ${cur.name.toUpperCase()}\nTag ${daysBetween(TRIP.start,d)+1} der Reise.\n\nFrag mich nach Restaurants, Aktivitäten, Gezeiten. Oder sag mir was ich ins Reisedoc eintragen soll.`;
  } else {
    greeting = `// KI REISELEITER\nBretagne & Normandie 2026.\n\nFragen, Empfehlungen, Notizen eintragen — ich helfe.`;
  }
  const t = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  msgs.innerHTML = `<div class="msg ai"><div class="msg-bubble">${greeting.replace(/\n/g,'<br>')}</div><div class="msg-time">${t}</div></div>`;
  chatHistory = [{ role:'assistant', content:greeting }];
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function toggleCard(i) { document.getElementById(`card-${i}`).classList.toggle('open'); }

function openEtappe(i) {
  switchTab('etappen', document.querySelectorAll('.nav-item')[1]);
  setTimeout(() => {
    const card = document.getElementById(`card-${i}`);
    card?.classList.add('open');
    card?.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 100);
}

function switchTab(name, btn) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById(`s-${name}`).classList.add('active');
  btn.classList.add('active');
  window.scrollTo(0,0);
}

function toggleTheme() {
  const html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme')==='dark'?'light':'dark');
}
